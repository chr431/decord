# decord fork 发布工作流 — 一键构建 Windows GPU 版并发布 GitHub Release
#
# 手动触发（Actions → Release → Run workflow），输入版本号即完成：
#   1. 校验版本格式 + 确认 tag 不存在
#   2. 安装 CUDA Toolkit + 下载 FFmpeg 9.0（BtbN shared build）
#   3. CMake GPU 构建 decord.dll（USE_CUDA=ON）
#   4. 若 libinfo.py / pyproject.toml 版本 != 输入版本：两文件同步升版本 → commit → push 到目标分支
#   5. 打 tag v<版本> 并 push
#   6. 构建 pip wheel（scikit-build-core，bump 之后跑以拿到正确版本号；
#      内容 = decord.dll + FFmpeg 导入闭包 6 DLL，自动安装规则见 CMakeLists）
#   7. 打包 zip（布局 = RaceVideoToLog 的 _decord_build/，解压即用）：
#        decord.dll + FFmpeg 9.0 DLLs + ffprobe.exe + python/decord/
#   8. 创建 GitHub Release（notes = 自上一 tag 的 commit 列表）+ 上传 zip 与 wheel
#
# 只监听 workflow_dispatch（push/tag 不会二次触发）。构建失败时不会产生
# 任何 commit / tag / release（commit+tag 在构建成功后才执行）。
#
# 注意：CUDA 路径必须用正斜杠传 -DUSE_CUDA —— CMake 会把反斜杠当转义
# 序列（"Invalid character escape '\P'"）。FindCUDA.cmake 与本地验证过。

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.7.0). Creates tag v<version>.'
        required: true
        type: string
      ref:
        description: 'Branch to release from'
        required: false
        default: 'master'
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # windows-2022（VS 2022）而非 windows-latest：锁定镜像避免 runner VS 版本漂移。
    # CUDA 13.3 的 VS 集成同时支持 VS 2022 与 VS 18 2026（本地已用 VS 18 2026 验证过
    # CMake 构建，windows-latest 也能过），但发布流水线用固定镜像更可复现。
    # decord.dll 的 CUDA（cudart/NVDEC/NVML/驱动 API）全部运行时动态加载（nv_gpu_dyn），
    # 构建工具链版本不影响产物 —— 导入表只有 FFmpeg + VC 运行库。
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # 全历史：发布 notes 需要自上一 tag 的 commit 列表
          token: ${{ github.token }}
          submodules: recursive  # 3rdparty/dlpack + dmlc-core：缺了 dlpack.h / logging.h 编不过

      - name: Validate version
        shell: pwsh
        run: |
          if ("${{ inputs.version }}" -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "版本必须是纯 X.Y.Z（当前: ${{ inputs.version }}）"
            exit 1
          }
          if (git tag -l "v${{ inputs.version }}" | Select-String -Quiet "v${{ inputs.version }}") {
            Write-Error "tag v${{ inputs.version }} 已存在，先删 tag 或换版本号"
            exit 1
          }

      # 0.8.1 起 CUDA 构建不再需要 CUDA Toolkit（无 nvcc/cudart，驱动 API 全部
      # 运行时动态加载 + improc kernel 以内嵌 PTX 提供）—— 此前卡发布数次的
      # Jimver/cuda-toolkit 网络安装步骤已删除。

      - name: Download FFmpeg 9.0 (shared)
        shell: pwsh
        run: |
          $ffmpegZip = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip"
          curl -L -o ffmpeg.zip $ffmpegZip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg
          Get-ChildItem ffmpeg

      - name: Build decord (GPU)
        shell: pwsh
        run: |
          # 0.8.1：无 CUDA Toolkit —— USE_CUDA=ON 仅启用混合解码（驱动 API
          # 运行时动态加载 + 内嵌 PTX kernel），不再需要 CUDA_PATH。
          $ffmpegDir = (Resolve-Path "ffmpeg/ffmpeg-n9.0-latest-win64-gpl-shared-9.0").Path
          Write-Host "FFMPEG: $ffmpegDir"
          cmake -S . -B build -DUSE_CUDA=ON -DFFMPEG_DIR="$ffmpegDir" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "build/Release/decord.dll")) {
            Write-Error "decord.dll 未生成（构建失败）"
            exit 1
          }

      - name: Bump version + tag
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          $libinfo = "python/decord/_ffi/libinfo.py"
          $pyproject = "pyproject.toml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $changed = $false
          # 版本事实源：libinfo.py（pyproject.toml / __init__.py 从中派生）
          $content = [System.IO.File]::ReadAllText((Resolve-Path $libinfo))
          $cur = [regex]::Match($content, '__version__ = "(\d+\.\d+\.\d+)"').Groups[1].Value
          Write-Host "当前 libinfo.py 版本: $cur"
          if ($cur -ne $ver) {
            $content = $content -replace '__version__ = "\d+\.\d+\.\d+"', "__version__ = `"$ver`""
            # UTF-8 无 BOM（PowerShell 5.1 的 utf8 会带 BOM，pwsh 7 不会，这里显式保证）
            [System.IO.File]::WriteAllText((Resolve-Path $libinfo), $content, (New-Object System.Text.UTF8Encoding($false)))
            git add $libinfo
            $changed = $true
          } else {
            Write-Host "libinfo.py 已是 $ver，无需 bump"
          }
          # wheel 元数据：pyproject.toml 与 libinfo.py 必须同步（scikit-build-core 读 [project].version）
          $pp = [System.IO.File]::ReadAllText((Resolve-Path $pyproject))
          $ppCur = [regex]::Match($pp, '(?m)^version = "(\d+\.\d+\.\d+)"').Groups[1].Value
          Write-Host "当前 pyproject.toml 版本: $ppCur"
          if ($ppCur -ne $ver) {
            $pp = $pp -replace '(?m)^version = "\d+\.\d+\.\d+"', "version = `"$ver`""
            [System.IO.File]::WriteAllText((Resolve-Path $pyproject), $pp, (New-Object System.Text.UTF8Encoding($false)))
            git add $pyproject
            $changed = $true
          } else {
            Write-Host "pyproject.toml 已是 $ver，无需 bump"
          }
          # C API 版本串与 libinfo 同步（此前漏更，三源漂移到 0.7.10 vs 0.7.14）
          $capi = "include/decord/runtime/c_runtime_api.h"
          $capiContent = [System.IO.File]::ReadAllText((Resolve-Path $capi))
          $capiCur = [regex]::Match($capiContent, 'DECORD_VERSION "(\d+\.\d+\.\d+)"').Groups[1].Value
          if ($capiCur -ne $ver) {
            $capiContent = $capiContent -replace 'DECORD_VERSION "\d+\.\d+\.\d+"', "DECORD_VERSION `"$ver`""
            [System.IO.File]::WriteAllText((Resolve-Path $capi), $capiContent, (New-Object System.Text.UTF8Encoding($false)))
            git add $capi
            $changed = $true
          } else {
            Write-Host "c_runtime_api.h 已是 $ver，无需 bump"
          }
          if ($changed) {
            git commit -m "release: v$ver"
            git push origin "HEAD:${{ inputs.ref }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "版本文件已是 $ver，无需 bump commit"
          }
          git tag "v$ver"
          git push origin "v$ver"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # wheel 必须在版本 bump 之后构建，文件名/元数据才是 v<版本>。
      # scikit-build-core 走 PEP 517 隔离构建（自动拉 scikit-build-core/cmake/ninja）；
      # Ninja 生成器需要 cl 在 PATH，msvc-dev-cmd 负责注入 vcvars 环境。
      # [tool.scikit-build] 在 SKBUILD+WIN32 下默认 USE_CUDA=ON，无需显式传。
      - name: Setup MSVC for pip wheel
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build pip wheel
        shell: pwsh
        env:
          FFMPEG_DIR: ${{ github.workspace }}/ffmpeg/ffmpeg-n9.0-latest-win64-gpl-shared-9.0
        run: |
          pip wheel . --no-deps -w dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
          # 闭包自检：wheel 内必须恰好是 decord.dll + 6 个 FFmpeg DLL，
          # 不允许 avdevice/ffprobe/其它大版本系列混入
          $names = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist/*.whl")).Entries.FullName
          $dlls = $names | Where-Object { $_ -match '^decord/[^/]+\.dll$' } | ForEach-Object { Split-Path $_ -Leaf } | Sort-Object
          $expected = @('avcodec-63.dll','avfilter-12.dll','avformat-63.dll','avutil-61.dll','decord.dll','swresample-7.dll','swscale-10.dll')
          if ((Compare-Object $dlls $expected).Count -ne 0) {
            Write-Error "wheel DLL 闭包与预期不符: $($dlls -join ', ')"
            exit 1
          }

      - name: Generate release notes
        id: notes
        shell: pwsh
        run: |
          # tag 已创建：HEAD 即 bump commit；取 HEAD~1 之前的上一个 tag
          $prev = git describe --tags --abbrev=0 "HEAD~1" 2>$null
          if ($prev) { $prev = $prev.Trim() }  # git 输出带尾随换行，必须 Trim
          if ($prev) {
            $log = git log --oneline --no-merges "$prev..HEAD"
          } else {
            $log = git log --oneline --no-merges -50
          }
          $sha = "$env:GITHUB_SHA".Substring(0, 7)
          $body = "decord fork v${{ inputs.version }}（GPU NVDEC + CPU 解码，FFmpeg 9.0）`n`n" +
                  "构建源: ${{ inputs.ref }} @ $sha`n`n## Commits`n$log"
          [System.IO.File]::WriteAllText("notes.md", $body, (New-Object System.Text.UTF8Encoding($false)))

      - name: Package release artifact
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          $ffmpegBin = "ffmpeg/ffmpeg-n9.0-latest-win64-gpl-shared-9.0/bin"
          # 布局 = RaceVideoToLog 的 _decord_build/（setup_venv.bat 直接解压拷贝）
          $stage = "_decord_build"
          New-Item -ItemType Directory -Path "$stage/python" -Force | Out-Null
          Copy-Item "build/Release/decord.dll" $stage/
          Copy-Item "$ffmpegBin/*.dll" $stage/
          Copy-Item "$ffmpegBin/ffprobe.exe" $stage/
          Copy-Item -Recurse "python/decord" "$stage/python/decord"
          Compress-Archive -Path $stage -DestinationPath "decord-$ver-win64-gpu.zip"
          Write-Host "zip contents:"
          Get-ChildItem -Recurse $stage | ForEach-Object { $_.FullName.Replace("$PWD\", "") }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $whl = (Get-ChildItem "dist/*.whl").FullName
          gh release create "v${{ inputs.version }}" "decord-${{ inputs.version }}-win64-gpu.zip" "$whl" `
            --title "decord v${{ inputs.version }}" `
            --notes-file notes.md
