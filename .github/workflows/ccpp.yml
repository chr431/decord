name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential python3-dev python3-setuptools make cmake ffmpeg libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev
    - name: install test dependencies
      run: pip3 install pytest
    - name: install (scikit-build-core builds libdecord)
      run: pip3 install -e .
    - name: unit tests
      run: python3 -m pytest tests/python/unittests/ -v
