name: Publish to PYPI

on:
  push:
    branches: [ master ]
    tags:
      - "v*"
  pull_request:
    branches: [ master ]

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Fetch FFmpeg 6.1 (Linux, manylinux-compatible shared build)
      if: runner.os == 'Linux'
      run: |
        curl -L -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n6.1-latest-linux64-gpl-shared-6.1.tar.xz
        tar -xf ffmpeg.tar.xz
        echo "FFMPEG_DIR=$(pwd)/ffmpeg-n6.1-latest-linux64-gpl-shared-6.1" >> "$GITHUB_ENV"
    - name: Fetch FFmpeg 6.1 (Windows, shared + dev)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        curl -L -o ffmpeg-shared.7z https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-6.1-full-shared.7z
        curl -L -o ffmpeg-dev.7z https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-6.1-full-dev.7z
        Expand-Archive ffmpeg-shared.7z -DestinationPath .
        Expand-Archive ffmpeg-dev.7z -DestinationPath .
        $ffdir = Get-ChildItem -Directory | Where-Object { $_.Name -like 'ffmpeg-*' } | Select-Object -First 1
        echo "FFMPEG_DIR=$((Get-Location).Path)\$($ffdir.Name)" >> $env:GITHUB_ENV
    - name: Build wheels
      uses: pypa/cibuildwheel@v2.22.0
      env:
        CIBW_BUILD: cp39-* cp310-* cp311-* cp312-*
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_17_x86_64
        CIBW_ARCHS_LINUX: x86_64
        CIBW_ENVIRONMENT: FFMPEG_DIR="${{ env.FFMPEG_DIR }}"
        CIBW_BEFORE_ALL_MACOS: brew install ffmpeg
        CIBW_TEST_COMMAND: python -c "import decord; print('decord', decord.__version__)"
      with:
        package-dir: .
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.os }}
        path: wheelhouse/*.whl
        if-no-files-found: error
  deploy:
    name: Publish to (Test)PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        path: dist/
        merge-multiple: true
    - name: List artifacts
      run: |
        ls -lh dist/
    - name: Publish package to TestPyPI
      if: startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist/
        skip-existing: true
    - name: Publish package to PyPI
      if: startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: dist/
        skip-existing: true
