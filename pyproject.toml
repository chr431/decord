[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.18", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "decord"
version = "0.7.6"
description = "Efficient video decoding and loading for deep learning"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.14.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/dmlc/decord"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.version = ">=3.15"
# Package the python code and the built shared library side by side:
# wheel.packages places python/decord at site-packages/decord, and the
# CMake install rule (install(TARGETS decord ... DESTINATION decord))
# places the shared library in the same directory, where libinfo.py looks.
wheel.packages = ["python/decord"]
# CMake install prefix root inside the wheel: the CMake rule installs the
# shared library to DESTINATION decord, which resolves to
# site-packages/decord/, next to the python package.
wheel.install-dir = "."
